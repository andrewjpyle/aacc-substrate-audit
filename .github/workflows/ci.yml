name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests (fails if fewer tests ran than the floor, so a gutted suite cannot pass)
        run: |
          set -o pipefail
          node --test --test-reporter=tap test/*.test.mjs | tee tap.txt
          PASS=$(awk '/^ok /{n++} END{print n+0}' tap.txt)
          FAIL=$(awk '/^not ok /{n++} END{print n+0}' tap.txt)
          echo "passed: $PASS failed: $FAIL floor: 24"
          test "$FAIL" -eq 0
          test "$PASS" -ge 24
